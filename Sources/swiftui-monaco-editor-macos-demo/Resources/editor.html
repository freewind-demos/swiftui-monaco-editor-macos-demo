<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <style>
      html,
      body,
      #editor {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  </head>
  <body>
    <div id="editor"></div>
    <script>
      let editor = null;
      let pendingValue = "";

      const post = (type, value) => {
        window.webkit.messageHandlers.editor.postMessage({ type, value });
      };

      window.setEditorValue = (value) => {
        pendingValue = value;

        if (!editor) {
          return;
        }

        if (editor.getValue() !== value) {
          editor.setValue(value);
          editor.setPosition({ lineNumber: 1, column: 1 });
        }
      };

      window.duplicateCurrentLine = () => {
        if (!editor) {
          return;
        }

        editor.trigger("keyboard", "editor.action.copyLinesDownAction", null);
      };

      window.expandSelection = () => {
        if (!editor) {
          return;
        }

        editor.trigger("keyboard", "editor.action.smartSelect.expand", null);
      };

      require.config({
        paths: {
          vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs",
        },
      });

      require(["vs/editor/editor.main"], () => {
        editor = monaco.editor.create(document.getElementById("editor"), {
          value: pendingValue,
          language: "swift",
          theme: "vs-dark",
          automaticLayout: true,
          minimap: { enabled: true },
          fontSize: 14,
        });

        editor.addCommand(
          monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyD,
          () => window.duplicateCurrentLine(),
        );

        editor.addCommand(
          monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyE,
          () => window.expandSelection(),
        );

        editor.onDidChangeModelContent(() => {
          post("change", editor.getValue());
        });

        post("ready", pendingValue);
      });
    </script>
  </body>
</html>
